<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha Primeira Página Web</title>

    <style>
        /* Estilização geral da página */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f8f8;

            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        /* Container principal */
        .container {
            text-align: center;

            padding: 40px;

            background-color: #ffffff;

            border-radius: 8px;

            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        }

        /* Título */
        h1 {
            color: #3498db;

            font-size: 2em;

            margin-bottom: 20px;
        }

        /* Parágrafo */
        p {
            color: #555555;

            font-size: 1.2em;
        }

        /* Botão */
        button {
            background-color: #3498db;

            color: #ffffff;

            font-size: 1.2em;

            padding: 10px 20px;

            border: none;

            border-radius: 4px;

            cursor: pointer;

            transition: background-color 0.3s ease;
        }

        /* Efeito quando o mouse passa sobre o botão */
        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>

<body>

    <!-- Container principal -->
    <div class="container">

        <!-- Título -->
        <h1>Olá, Mundo!</h1>

        <!-- Texto -->
        <p>
            Esta é minha primeira página web criada com Python no Colab.
            Bem-vindo ao mundo da programação web!
        </p>

        <!-- Botão -->
        <button onclick="alert('Botão clicado!')">
            Clique em Mim
        </button>

    </div>

</body>

</html>
